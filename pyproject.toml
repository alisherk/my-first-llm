[project]
name = "my-first-llm"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "numpy>=2.5.5",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
